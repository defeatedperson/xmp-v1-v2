user  root;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Lua 代码目录（镜像内 /www/lua，由 Dockerfile COPY 进来）
    lua_package_path "/www/lua/?.lua;;";

    # 极简 CC 防护的运行时状态（单机内存，跨 worker 共享，不跨多实例）
    # - xmp_cc_ctr: 30 秒窗口计数（IP/域名）
    # - xmp_cc_state: 挑战会话、验证通过、失败次数等
    # - xmp_cc_ban: IP 封禁
    lua_shared_dict xmp_cc_ctr   64m;
    lua_shared_dict xmp_cc_state 32m;
    lua_shared_dict xmp_cc_ban   16m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  off;
    error_log   /var/log/openresty/error.log  warn;

    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path /www/cache/proxy levels=1:2 keys_zone=proxy_cache_zone:10m max_size=1g inactive=60m use_temp_path=off;

    # 先加载子站点配置，子站点将根据域名或 IP 自行监听端口
    include /www/conf/*.conf;

    # 默认站点：当没有匹配的域名/IP 时，直接丢弃连接，不返回任何内容
    # 用于防止通过 IP 扫描获取默认响应或暴露多余信息
    server {
        listen       80 default_server;
        server_name  _;

        access_log off;

        return 444;
    }
}
